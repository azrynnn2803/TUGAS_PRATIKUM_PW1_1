<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROM MAHASISWA</title>
    <style>
         body {
            font-family: serif, arial, sans-serif;
            margin: 20px;
            color: #000;
        }
        h2 {
             font-family: serif;
        }
        fieldet {
            border: 1px solid #000;
            margin-bottom: 15px;
            padding: 10px;
        }
        legend {
            padding: 0 5px;
        }
        .form-row {
            margin-bottom: 8px;
        }
        .form-row label {
            display: inline-block;
            width: 160px;
        }
        textarea {
            vertical-align: top;
            width: 250px;
            height: 60px;
        }
        input[type="text"]{
            width: 250px;
        }
        .checbox-group {
            display: inline-block
        }
    </style>
</head>
<body>

    <h2>Form Mahasiswa</h2>
    <from>
        <!--fieldset Data Mahasiswa-->
        <fieldset>
            <legend>Data Mahasiswa</legend>
            <div class="form-row">
                <label for="Nama">Nama :</label>
                <input type="text" id="nama" name="nama">
            </div>
            <div class="form-row">
                <label for="NPM">NPM :</label>
                <input type="text" id="npm" name="npm">
            </div>
            <div class="form-row">
                <label for="Kelas">Kelas</label>
                <select>
                    <option value="">-</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                </select>
            </div>
            <div class="form-row">
                <label>Jenis Kelamin</label>
                <input type="radio" name="gender" value="pria">pria
                <input type="radio" name="gender" value="wanita">wanita
            </div>
        </fieldset>

        <!--fieldset Tempat TInggal Mahasiswa-->
        <fieldset>
            <legend>Tempat Tinggal Mahasiswa</legend>
            <div class="form-row">
                <label for="Alamat">Alamat :</label>
                <textarea id="alamat" name="alamat"></textarea>
            </div>
            <div class="form-row">
                <label for="Kecamatan">Kecamatan</label>
                <input type="text" id="kecamatan" name="kecamatan">
            </div>
            <div class="form-row">
                <label for="kabupaten">Kabupaten</label>
                <input type="text" id="kabupaten" name="kabupaten">
            </div>
            <div class="form-row">
                <label for="provinsi">Provinsi</label>
                <input type="text" id="provinsi" name="provinsi">
            </div>
            <div class="form-row">
                <label for="kodepos">Kode Pos</label>
                <input type="text" id="kodepos" name="kodepos">
            </div>
        </fieldset>
        
        <!--fieldset LAIN-LAINNYA-->
        <fieldset>
            <legend>Lain-Lain</legend>
            <div class="from-row">
                <label>Bahasa Pemograman</label>
                <div class="checbox-group"style="vertical-align: top;">
                    <input type="checkbox">C / C++
                    <input type="checkbox">Go lang
                    <input type="checkbox">Python
                    <input type="checkbox">Lainnya<br>
                    <input type="checkbox">HTML
                    <input type="checkbox">PHP
                    <input type="checkbox">JavaScript
                    <input type="checkbox">Ruby
                </div>
            </div>
            <div class="form-row">
                <label>Kegiatan</label>
                <div class="checbox-group"style="vertical-align: top;">
                    <input type="checkbox">Organisasi kemahasiswaan
                    <input type="checkbox">Bidang Olahraga
                    <input type="checkbox">Lainnya<br>
                    <input type="checkbox">Organisasi Di Luar Kampus
                    <input type="checkbox">Bidang Seni
                </div>
            </div>
        </fieldset>

        <!--fieldset Tombol Reset & submit -->
            <button type="reset">Reset</button>
           <button type="submit">Submit</button>
    </form>
    
</body>
</html>
